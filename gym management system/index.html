<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Revive Fitness</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="login-container">


        <!-- LEFT SIDE -->

        <div class="gym-section">

            <div class="overlay">

                <h1>
                    REVIVE<br>
                    FITNESS
                </h1>

                <p>
                    TRAIN • WORK • TRANSFORM
                </p>

                <div class="gym-info">

                    <span>🏋️</span>

                    <span>
                        Your journey starts here
                    </span>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-section">

            <div class="login-box">

                <div class="logo">
                    RF
                </div>


                <h2>
                    Welcome Back
                </h2>

                <p class="login-text">
                    Select your account type to continue.
                </p>


                <!-- ACCOUNT OPTIONS -->

                <div class="account-options">


                    <!-- ADMIN -->

                    <a href="admin-login.html"
                       class="account-card">

                        <div class="account-icon">
                            👨‍💼
                        </div>

                        <div class="account-info">

                            <h3>
                                Admin Login
                            </h3>

                            <p>
                                Manage members, attendance,
                                payments and gym operations.
                            </p>

                        </div>

                        <div class="account-arrow">
                            →
                        </div>

                    </a>


                    <!-- MEMBER -->

                    <a href="member-login.html"
                       class="account-card">

                        <div class="account-icon">
                            🏋️
                        </div>

                        <div class="account-info">

                            <h3>
                                Member Login
                            </h3>

                            <p>
                                View your membership,
                                workouts and progress.
                            </p>

                        </div>

                        <div class="account-arrow">
                            →
                        </div>

                    </a>


                </div>


                <p class="footer-text">
                    © 2026 Revive Fitness
                </p>

            </div>

        </div>

    </div>

</body>

</html>
