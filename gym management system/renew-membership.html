<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Renew Membership - Revive Fitness</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        #amount {
            background: #eeeeee;
            font-weight: bold;
        }

        #currentExpiry {
            background: #eeeeee;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #222;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #222;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Revive Fitness
    </h1>

    <p class="subtitle">
        Renew Member Membership
    </p>


    <!-- SELECT MEMBER -->

    <div class="form-group">

        <label>
            Select Member
        </label>

        <select
            id="member"
            onchange="showMemberDetails()">

            <option value="">
                -- Select Member --
            </option>

        </select>

    </div>


    <!-- CURRENT EXPIRY -->

    <div class="form-group">

        <label>
            Current Expiry Date
        </label>

        <input
            type="date"
            id="currentExpiry"
            readonly>

    </div>


    <!-- NEW PLAN -->

    <div class="form-group">

        <label>
            Renewal Membership Plan
        </label>

        <select
            id="plan"
            onchange="updateAmount()">

            <option value="">
                -- Select Plan --
            </option>

            <option
                value="Monthly"
                data-amount="1500">

                Monthly - ₹1,500

            </option>

            <option
                value="Quarterly"
                data-amount="4000">

                Quarterly - ₹4,000

            </option>

            <option
                value="Half Yearly"
                data-amount="7000">

                Half Yearly - ₹7,000

            </option>

            <option
                value="Yearly"
                data-amount="12000">

                Yearly - ₹12,000

            </option>

        </select>

    </div>


    <!-- AUTOMATIC AMOUNT -->

    <div class="form-group">

        <label>
            Renewal Amount (₹)
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Select renewal plan"
            readonly>

    </div>


    <!-- NEW EXPIRY -->

    <div class="form-group">

        <label>
            New Expiry Date
        </label>

        <input
            type="date"
            id="newExpiry"
            readonly>

    </div>


    <button onclick="renewMembership()">

        Renew Membership

    </button>


    <p id="message"></p>


    <a
        href="admin-dashboard.html"
        class="back-btn">

        ← Back to Admin Dashboard

    </a>

</div>


<script>


/* =====================================
   LOAD MEMBERS
===================================== */

let members =
    JSON.parse(
        localStorage.getItem("members")
    ) || [];


const memberDropdown =
    document.getElementById("member");


/* =====================================
   SHOW MEMBERS IN DROPDOWN
===================================== */

function loadMembers() {

    memberDropdown.innerHTML = `

        <option value="">
            -- Select Member --
        </option>

    `;


    members.forEach(function(member) {

        const option =
            document.createElement("option");

        option.value =
            member.username;

        option.textContent =
            member.name + " (" +
            member.username +
            ")";

        memberDropdown.appendChild(option);

    });

}


loadMembers();


/* =====================================
   SHOW SELECTED MEMBER DETAILS
===================================== */

function showMemberDetails() {

    const username =
        memberDropdown.value;


    const member =
        members.find(function(member) {

            return member.username === username;

        });


    if (!member) {

        document.getElementById(
            "currentExpiry"
        ).value = "";

        return;

    }


    document.getElementById(
        "currentExpiry"
    ).value =
        member.expiryDate || "";

}


/* =====================================
   AUTOMATIC AMOUNT
===================================== */

function updateAmount() {

    const plan =
        document.getElementById("plan");


    const selectedOption =
        plan.options[plan.selectedIndex];


    const amount =
        selectedOption.getAttribute(
            "data-amount"
        );


    document.getElementById(
        "amount"
    ).value =
        amount || "";


    calculateNewExpiry();

}


/* =====================================
   CALCULATE NEW EXPIRY
===================================== */

function calculateNewExpiry() {

    const username =
        memberDropdown.value;


    const plan =
        document.getElementById("plan").value;


    const member =
        members.find(function(member) {

            return member.username === username;

        });


    if (!member || !plan) {

        document.getElementById(
            "newExpiry"
        ).value = "";

        return;

    }


    let baseDate;


    const today =
        new Date();


    const currentExpiry =
        new Date(
            member.expiryDate
        );


    /*
       If membership is still active,
       renewal starts after current expiry.

       If already expired,
       renewal starts from today.
    */

    if (
        currentExpiry >= today
    ) {

        baseDate =
            new Date(currentExpiry);

    } else {

        baseDate =
            new Date(today);

    }


    let months = 0;


    if (plan === "Monthly") {

        months = 1;

    }

    else if (plan === "Quarterly") {

        months = 3;

    }

    else if (plan === "Half Yearly") {

        months = 6;

    }

    else if (plan === "Yearly") {

        months = 12;

    }


    baseDate.setMonth(
        baseDate.getMonth() + months
    );


    document.getElementById(
        "newExpiry"
    ).value =
        formatDate(baseDate);

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(date) {

    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================
   RENEW MEMBERSHIP
===================================== */

function renewMembership() {

    const username =
        memberDropdown.value;


    const plan =
        document.getElementById(
            "plan"
        ).value;


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const newExpiry =
        document.getElementById(
            "newExpiry"
        ).value;


    if (
        username === "" ||
        plan === "" ||
        amount === "" ||
        newExpiry === ""
    ) {

        alert(
            "Please select a member and renewal plan."
        );

        return;

    }


    const memberIndex =
        members.findIndex(
            function(member) {

                return (
                    member.username ===
                    username
                );

            }
        );


    if (memberIndex === -1) {

        alert(
            "Member not found."
        );

        return;

    }


    /*
       Update member information.
    */

    members[memberIndex].plan =
        plan;


    members[memberIndex].amount =
        Number(amount);


    members[memberIndex].expiryDate =
        newExpiry;


    /*
       Save updated members.
    */

    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );


    document.getElementById(
        "message"
    ).textContent =
        "Membership renewed successfully!";


    document.getElementById(
        "message"
    ).style.color =
        "green";


    /*
       Clear form.
    */

    memberDropdown.value = "";

    document.getElementById(
        "currentExpiry"
    ).value = "";

    document.getElementById(
        "plan"
    ).value = "";

    document.getElementById(
        "amount"
    ).value = "";

    document.getElementById(
        "newExpiry"
    ).value = "";

}


/* =====================================
   UPDATE EXPIRY WHEN MEMBER CHANGES
===================================== */

document
    .getElementById("member")
    .addEventListener(
        "change",
        function() {

            showMemberDetails();

            updateAmount();

        }
    );

</script>

</body>

</html>
