<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payments - Revive Fitness</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            background: #f4f4f4;

            color: #222;

        }


        /* HEADER */

        header {

            background: #222;

            color: white;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-size: 24px;

            font-weight: bold;

        }


        .back-btn {

            background: white;

            color: #222;

            padding: 9px 16px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

        }


        /* MAIN */

        .container {

            width: 1000px;

            max-width: 94%;

            margin: 35px auto;

        }


        .title {

            margin-bottom: 25px;

        }


        .title h1 {

            margin-bottom: 8px;

        }


        .title p {

            color: #777;

        }


        /* FORM */

        .form-box {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.12);

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .input-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

        }


        .input-group input,

        .input-group select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        /* AUTOMATIC FIELDS */

        .automatic {

            background: #eeeeee;

            font-weight: bold;

        }


        /* CASH STATUS */

        #cashStatusGroup {

            display: none;

        }


        /* SAVE */

        .save-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .save-btn:hover {

            background: #444;

        }


        /* PAYMENT HISTORY */

        .history {

            margin-top: 30px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.12);

        }


        .history h2 {

            margin-bottom: 20px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,

        td {

            padding: 12px;

            border: 1px solid #ddd;

            text-align: center;

        }


        th {

            background: #222;

            color: white;

        }


        .paid {

            color: green;

            font-weight: bold;

        }


        .unpaid {

            color: red;

            font-weight: bold;

        }


        .delete-btn {

            padding: 6px 10px;

            border: none;

            border-radius: 5px;

            background: #d9534f;

            color: white;

            cursor: pointer;

        }


        .delete-btn:hover {

            background: #c9302c;

        }


        .empty {

            text-align: center;

            color: #777;

        }


        /* MOBILE */

        @media (max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;

            }


            header {

                padding: 15px 20px;

            }


            .history {

                overflow-x: auto;

            }


            table {

                min-width: 850px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        REVIVE FITNESS

    </div>


    <a
        href="admin-dashboard.html"
        class="back-btn">

        Dashboard

    </a>

</header>



<div class="container">


    <!-- TITLE -->

    <div class="title">

        <h1>
            Payment Management
        </h1>

        <p>
            Manage gym member payments
        </p>

    </div>



    <!-- PAYMENT FORM -->

    <div class="form-box">


        <div class="form-grid">


            <!-- MEMBER -->

            <div class="input-group">

                <label>
                    Select Member
                </label>


                <select
                    id="member"
                    onchange="loadMemberDetails()">

                    <option value="">
                        -- Select Member --
                    </option>

                </select>

            </div>



            <!-- PLAN AUTOMATIC -->

            <div class="input-group">

                <label>
                    Membership Plan
                </label>


                <input
                    type="text"
                    id="plan"
                    class="automatic"
                    placeholder="Select member"
                    readonly>

            </div>



            <!-- AMOUNT AUTOMATIC -->

            <div class="input-group">

                <label>
                    Amount (₹)
                </label>


                <input
                    type="number"
                    id="amount"
                    class="automatic"
                    placeholder="Select member"
                    readonly>

            </div>



            <!-- PAYMENT DATE -->

            <div class="input-group">

                <label>
                    Payment Date
                </label>


                <input
                    type="date"
                    id="date">

            </div>



            <!-- PAYMENT METHOD -->

            <div class="input-group">

                <label>
                    Payment Method
                </label>


                <select
                    id="method"
                    onchange="paymentMethodChanged()">

                    <option value="">
                        -- Select Method --
                    </option>

                    <option value="Google Pay">
                        Google Pay
                    </option>

                    <option value="PhonePe">
                        PhonePe
                    </option>

                    <option value="Credit Card">
                        Credit Card
                    </option>

                    <option value="Debit Card">
                        Debit Card
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                </select>

            </div>



            <!-- AUTOMATIC STATUS -->

            <div class="input-group">

                <label>
                    Payment Status
                </label>


                <input
                    type="text"
                    id="status"
                    class="automatic"
                    value=""
                    placeholder="Select payment method"
                    readonly>

            </div>



            <!-- CASH STATUS -->

            <div
                class="input-group"
                id="cashStatusGroup">

                <label>
                    Cash Payment Status
                </label>


                <select id="cashStatus">

                    <option value="">
                        -- Select Status --
                    </option>

                    <option value="Paid">
                        Paid
                    </option>

                    <option value="Unpaid">
                        Unpaid
                    </option>

                </select>

            </div>


        </div>



        <!-- SAVE -->

        <button
            class="save-btn"
            onclick="savePayment()">

            Save Payment

        </button>

    </div>



    <!-- HISTORY -->

    <div class="history">

        <h2>
            Payment History
        </h2>


        <table>

            <thead>

                <tr>

                    <th>
                        Member
                    </th>

                    <th>
                        Plan
                    </th>

                    <th>
                        Amount
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Method
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="paymentTable">

            </tbody>

        </table>

    </div>


</div>



<script>


/* =================================
   LOAD MEMBERS
================================= */

let members =

    JSON.parse(
        localStorage.getItem("members")
    ) || [];


let payments =

    JSON.parse(
        localStorage.getItem("payments")
    ) || [];



/* =================================
   LOAD MEMBER DROPDOWN
================================= */

function loadMembers() {


    const dropdown =
        document.getElementById(
            "member"
        );


    dropdown.innerHTML = `

        <option value="">
            -- Select Member --
        </option>

    `;


    if (members.length === 0) {

        const option =
            document.createElement(
                "option"
            );

        option.textContent =
            "No members found";

        option.disabled = true;

        dropdown.appendChild(
            option
        );

        return;

    }


    members.forEach(
        function(member) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                member.username;


            option.textContent =
                member.name;


            dropdown.appendChild(
                option
            );

        }
    );

}



/* =================================
   LOAD MEMBER PLAN + AMOUNT
================================= */

function loadMemberDetails() {


    const username =
        document.getElementById(
            "member"
        ).value;


    const member =
        members.find(
            function(member) {

                return (
                    member.username ===
                    username
                );

            }
        );


    const plan =
        document.getElementById(
            "plan"
        );


    const amount =
        document.getElementById(
            "amount"
        );


    if (!member) {

        plan.value = "";

        amount.value = "";

        return;

    }


    plan.value =
        member.plan || "";


    amount.value =
        member.amount || "";

}



/* =================================
   PAYMENT METHOD
================================= */

function paymentMethodChanged() {


    const method =
        document.getElementById(
            "method"
        ).value;


    const status =
        document.getElementById(
            "status"
        );


    const cashGroup =
        document.getElementById(
            "cashStatusGroup"
        );


    const cashStatus =
        document.getElementById(
            "cashStatus"
        );


    /*
       ONLINE PAYMENTS
    */

    if (

        method === "Google Pay" ||

        method === "PhonePe" ||

        method === "Credit Card" ||

        method === "Debit Card"

    ) {

        status.value =
            "Paid";


        cashGroup.style.display =
            "none";


        cashStatus.value =
            "";

    }


    /*
       CASH
    */

    else if (
        method === "Cash"
    ) {

        status.value = "";


        cashGroup.style.display =
            "block";

    }


    /*
       NO METHOD
    */

    else {

        status.value = "";


        cashGroup.style.display =
            "none";


        cashStatus.value =
            "";

    }

}



/* =================================
   SAVE PAYMENT
================================= */

function savePayment() {


    const username =
        document.getElementById(
            "member"
        ).value;


    const member =
        members.find(
            function(member) {

                return (
                    member.username ===
                    username
                );

            }
        );


    const plan =
        document.getElementById(
            "plan"
        ).value;


    const amount =
        document.getElementById(
            "amount"
        ).value;


    const date =
        document.getElementById(
            "date"
        ).value;


    const method =
        document.getElementById(
            "method"
        ).value;


    let status =
        document.getElementById(
            "status"
        ).value;


    const cashStatus =
        document.getElementById(
            "cashStatus"
        ).value;



    /* VALIDATION */

    if (!member) {

        alert(
            "Please select a member."
        );

        return;

    }


    if (
        plan === "" ||
        amount === ""
    ) {

        alert(
            "Membership plan or amount not found."
        );

        return;

    }


    if (date === "") {

        alert(
            "Please select payment date."
        );

        return;

    }


    if (method === "") {

        alert(
            "Please select payment method."
        );

        return;

    }



    /*
       CASH STATUS
    */

    if (
        method === "Cash"
    ) {

        if (
            cashStatus === ""
        ) {

            alert(
                "Please select Paid or Unpaid for cash payment."
            );

            return;

        }


        status =
            cashStatus;

    }



    /*
       CREATE PAYMENT
    */

    const payment = {

        id: Date.now(),

        member:
            member.name,

        username:
            member.username,

        plan:
            plan,

        amount:
            Number(amount),

        date:
            date,

        method:
            method,

        status:
            status

    };



    /*
       SAVE
    */

    payments.push(
        payment
    );


    localStorage.setItem(

        "payments",

        JSON.stringify(
            payments
        )

    );



    displayPayments();


    alert(
        "Payment saved successfully!"
    );


    clearForm();

}



/* =================================
   CLEAR FORM
================================= */

function clearForm() {


    document.getElementById(
        "member"
    ).value = "";


    document.getElementById(
        "plan"
    ).value = "";


    document.getElementById(
        "amount"
    ).value = "";


    document.getElementById(
        "date"
    ).value = "";


    document.getElementById(
        "method"
    ).value = "";


    document.getElementById(
        "status"
    ).value = "";


    document.getElementById(
        "cashStatus"
    ).value = "";


    document.getElementById(
        "cashStatusGroup"
    ).style.display =
        "none";

}



/* =================================
   DISPLAY PAYMENTS
================================= */

function displayPayments() {


    const table =
        document.getElementById(
            "paymentTable"
        );


    table.innerHTML = "";


    if (
        payments.length === 0
    ) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    No payment records yet.

                </td>

            </tr>

        `;

        return;

    }


    payments
        .slice()
        .reverse()
        .forEach(
            function(payment) {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${payment.member}
                    </td>

                    <td>
                        ${payment.plan}
                    </td>

                    <td>
                        ₹${payment.amount}
                    </td>

                    <td>
                        ${payment.date}
                    </td>

                    <td>
                        ${payment.method}
                    </td>

                    <td class="${
                        payment.status === "Paid"
                        ? "paid"
                        : "unpaid"
                    }">

                        ${payment.status}

                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deletePayment(${payment.id})">

                            Delete

                        </button>

                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );

}



/* =================================
   DELETE PAYMENT
================================= */

function deletePayment(id) {


    if (
        !confirm(
            "Are you sure you want to delete this payment?"
        )
    ) {

        return;

    }


    payments =
        payments.filter(
            function(payment) {

                return payment.id !== id;

            }
        );


    localStorage.setItem(

        "payments",

        JSON.stringify(
            payments
        )

    );


    displayPayments();

}



/* =================================
   START
================================= */

loadMembers();

displayPayments();


</script>


</body>

</html>
